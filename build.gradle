project(':crediya-common-security') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    description = 'Security module for common utilities in CrediYa microservices'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        implementation project(':crediya-common-domain')
        implementation project(':crediya-common-core') // Added for constants access
        implementation project(':crediya-common-starter')
        implementation 'io.projectreactor:reactor-core'

        api platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}")
        api 'org.springframework.boot:spring-boot-starter-security'
        api 'org.apache.commons:commons-lang3:3.18.0'

        api "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
        runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
        runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
