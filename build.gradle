// Version management
ext {
    springBootVersion = '3.5.6'
    commonVersion = '0.0.60'
    jjwtVersion = '0.12.6'
}

allprojects {
    group = 'co.com.pragma'
    version = rootProject.ext.commonVersion

    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'org.springframework:spring-beans:6.2.10'
        }
    }
}

project(':crediya-common-domain') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    description = 'Domain module for common utilities in CrediYa microservices'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        // No dependencies specific to domain module itself, or add them here
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = 'crediya-common-domain'
                pom {
                    name.set('CrediYa Common Domain')
                    description.set(project.description)
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/pedro00627/crediya-common")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

project(':crediya-common-core') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    description = 'Core constants and utilities for CrediYa microservices'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        implementation project(':crediya-common-domain')
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = 'crediya-common-core'
                pom {
                    name.set('CrediYa Common Core')
                    description.set(project.description)
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/pedro00627/crediya-common")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

project(':crediya-common-security') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    description = 'Security module for common utilities in CrediYa microservices'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        implementation project(':crediya-common-domain')
        implementation project(':crediya-common-starter') // Added this line
        implementation 'io.projectreactor:reactor-core' // Added this line

        api platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}")
        api 'org.springframework.boot:spring-boot-starter-security'
        api 'org.apache.commons:commons-lang3:3.18.0'

        api "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
        runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
        runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = 'crediya-common-security'
                pom {
                    name.set('CrediYa Common Security')
                    description.set(project.description)
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/pedro00627/crediya-common")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

project(':crediya-common-starter') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    description = 'Starter for common utilities in CrediYa microservices'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        implementation project(':crediya-common-domain')
        implementation project(':crediya-common-core')

        api platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}")
        api 'org.springframework.boot:spring-boot-autoconfigure'
        api 'org.springframework.boot:spring-boot-starter-webflux'
        api 'org.springframework:spring-web'

        api 'org.apache.logging.log4j:log4j-api'
        api 'org.apache.logging.log4j:log4j-core'
        api 'org.apache.logging.log4j:log4j-layout-template-json'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name.set('CrediYa Common Starter')
                    description.set(project.description)
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/pedro00627/crediya-common")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
