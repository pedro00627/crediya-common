3// Version management
ext {
    springBootVersion = '3.5.6'
    commonVersion = '0.0.60'
    jjwtVersion = '0.12.6'
}

allprojects {
    group = 'co.com.pragma'
    version = '0.0.61'

    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    // Configure UTF-8 encoding for all tasks
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test) {
        systemProperty 'file.encoding', 'UTF-8'
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'org.springframework:spring-beans:6.2.10'
        }
    }

    jacoco {
        toolVersion = "0.8.11"
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestCoverageVerification {
        dependsOn jacocoTestReport
        violationRules {
            rule {
                limit {
                    minimum = 0.80 // 80% coverage threshold
                }
            }
        }
    }
}

// Task to run all tests and generate coverage reports
task testAll {
    group = 'verification'
    description = 'Runs all tests across all subprojects and generates coverage reports'
    dependsOn subprojects.collect { it.tasks.withType(Test) }
    dependsOn subprojects.collect { it.tasks.named('jacocoTestReport') }
}

// Task to generate consolidated coverage report
task jacocoRootReport(type: JacocoReport) {
    group = 'verification'
    description = 'Generates consolidated JaCoCo coverage report for all subprojects'
    dependsOn testAll

    getAdditionalSourceDirs().from(subprojects.collect { project ->
        project.sourceSets.main.allSource.srcDirs
    })
    getSourceDirectories().from(subprojects.collect { project ->
        project.sourceSets.main.allSource.srcDirs
    })
    getClassDirectories().from(subprojects.collect { project ->
        project.sourceSets.main.output
    })
    getExecutionData().from(subprojects.collect { project ->
        project.fileTree(dir: "${project.buildDir}/jacoco", includes: ['*.exec'])
    })

    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
    }
}

project(':crediya-common-domain') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    description = 'Domain module for common utilities in CrediYa microservices'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
        testImplementation 'org.mockito:mockito-core:5.8.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = 'crediya-common-domain'
                pom {
                    name.set('CrediYa Common Domain')
                    description.set(project.description)
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/pedro00627/crediya-common")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

